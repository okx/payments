[project]
name = "okxweb3-app-paymentrouter-demo"
version = "0.0.0"
description = "Demo servers for okxweb3-app-paymentrouter"
requires-python = ">=3.11"
dependencies = [
    "okxweb3-app-paymentrouter[fastapi]",
    "okxweb3-app-x402[evm]",
    "okxweb3-app-mpp",
    "uvicorn>=0.20.0",
]
classifiers = ["Private :: Do Not Upload"]

[tool.uv.sources]
okxweb3-app-paymentrouter = { path = "..", editable = true }
okxweb3-app-x402 = { path = "../../x402", editable = true }
okxweb3-app-mpp = { path = "../../mpp", editable = true }
