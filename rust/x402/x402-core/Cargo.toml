[package]
name = "okxweb3-app-x402-core"
description = "OKX Agent Payments Protocol: x402 core types, server logic, and facilitator client"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository = "https://github.com/okx/payments/tree/main/rust/x402/x402-core"
rust-version = "1.82"
keywords = ["payments", "x402", "web3", "http", "crypto"]
categories = ["web-programming::http-server", "cryptography::cryptocurrencies"]

[lib]
name = "x402_core"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
