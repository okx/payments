[package]
name = "mpp-examples"
description = "Example servers using the MPP Rust Seller SDK"
# `version` required by manifest schema; irrelevant because `publish = false`.
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
mpp-evm = { package = "okxweb3-app-mpp", version = "0.2", path = "..", features = ["handlers"] }
mpp = { version = "0.10", features = ["server", "evm", "tower", "axum"] }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# mpp_session_server end-to-end demo needs PrivateKeySigner (payee signs SettleAuth).
alloy-signer-local = "=2.0.1"
alloy-primitives = "=1.5.7"

[[example]]
name = "mpp_photo_server"
path = "src/mpp_photo_server.rs"

[[example]]
name = "mpp_photo_split_server"
path = "src/mpp_photo_split_server.rs"

[[example]]
name = "mpp_session_server"
path = "src/mpp_session_server.rs"
